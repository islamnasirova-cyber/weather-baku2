name: Weather scraper

on:
  schedule:
    # GitHub использует UTC. Баку = UTC+4
    - cron: "0 9 * * *"    # 13:00 по Баку
    - cron: "0 12 * * *"   # 16:00 по Баку
    - cron: "0 15 * * *"   # 19:00 по Баку
  workflow_dispatch:        # кнопка ручного запуска для проверки

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright schedule
          playwright install --with-deps chromium

      - name: Run scraper
        run: python weather_scraper.py --now

      - name: Save results
        run: |
          git config user.name "weather-bot"
          git config user.email "bot@users.noreply.github.com"
          git add weather_baku.csv debug_page.txt || true
          git commit -m "Weather update $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "nothing to commit"
          git push
