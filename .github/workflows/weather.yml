name: Weather scraper

on:
  schedule:
    # GitHub использует UTC. Баку = UTC+4
    - cron: "0 9 * * *"    # 13:00 по Баку
    - cron: "0 12 * * *"   # 16:00 по Баку
    - cron: "0 15 * * *"   # 19:00 по Баку
  workflow_dispatch:        # кнопка ручного запуска для проверки

permissions:
  contents: write

# не запускать два сбора одновременно
concurrency:
  group: weather-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright schedule
          playwright install --with-deps chromium

      - name: Run scraper
        run: python weather_scraper.py --now

      - name: Show files
        run: ls -la

      - name: Save results
        run: |
          git config user.name "weather-bot"
          git config user.email "bot@users.noreply.github.com"

          for f in weather_baku.csv debug_page.txt; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done

          if git diff --cached --quiet; then
            echo "Нет новых данных для сохранения"
            exit 0
          fi

          git commit -m "Weather update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push origin HEAD:main
